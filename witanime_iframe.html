            const margin = function (name) {
                const dialogueValue = parseInt(row[name] || 0, 10) || 0;
                return dialogueValue || (parseInt(styleData[name] || 0, 10) || 0);
            };
            const marginL = margin('marginl');
            const marginR = margin('marginr');
            const marginV = margin('marginv');
            let x = isLeft ? 5 : (isRight ? 95 : 50);

                    if (/^format\s*:/i.test(line)) {
                        styleFields = line.replace(/^format\s*:/i, '').split(',').map(function (field) { return field.trim().toLowerCase(); });
                        return;
                    }
                    if (/^style\s*:/i.test(line)) {
                        const values = line.replace(/^style\s*:/i, '').split(',');
                        const row = {};
                        styleFields.forEach(function (field, index) { row[field] = values[index] || ''; });
                        const name = String(row.name || '').trim().toLowerCase();
                        if (name) { styles[name] = row; }
                    }
                    return;
                }
                if (section !== 'events') {
                    return;
                }
                if (/^format\s*:/i.test(line)) {
                    eventFields = line.replace(/^format\s*:/i, '').split(',').map(function (field) { return field.trim().toLowerCase(); });
                    return;
                }
                if (!/^dialogue\s*:/i.test(line)) {
                    return;
                }
                const body = line.replace(/^dialogue\s*:/i, '');
                const values = body.split(',');
                if (values.length < eventFields.length) {
                    return;
                }
                const fixedValues = values.slice(0, eventFields.length - 1);
                fixedValues.push(values.slice(eventFields.length - 1).join(','));
                const row = {};
                eventFields.forEach(function (field, index) { row[field] = fixedValues[index] || ''; });
                const start = subtitleTimestampToSeconds(row.start);
                const end = subtitleTimestampToSeconds(row.end);
                const rawText = String(row.text || '');
                const text = cleanSubtitleCueText(rawText
                    .replace(/\\[Nn]/g, '\n')
                    .replace(/\\h/g, ' ')
                    .replace(/\{[^}]*\}/g, ''));
                const style = styles[String(row.style || 'default').trim().toLowerCase()] || {};
                if (Number.isFinite(start) && Number.isFinite(end) && end > start && text) {
                    cues.push({
                        start: start,
                        end: end,
                        text: text,
                        placement: assAlignmentPlacement(rawText, style, row, playResX, playResY)
                    });
                }
            });
            cues.sort(function (first, second) { return first.start - second.start; });
            return cues;
        }

        function parseSubtitleDocument(value) {
            const text = String(value || '').replace(/^\uFEFF/, '');
            if (/^\s*\[script info\]/i.test(text) || /\n\s*\[events\]\s*\n/i.test(text)) {
                return parseAssSubtitle(text);
            }
            let cues = parseWebVtt(text);
            if (cues.length) {
                return cues;
            }
            const normalizedSrt = 'WEBVTT\n\n' + text.replace(
                /((?:\d{1,3}:)?\d{1,2}:\d{2}),(\d{1,3})(?=\s*-->|\s*$)/gm,
                '$1.$2'
            );
            return parseWebVtt(normalizedSrt);
        }

        function currentPlaybackPosition() {
            if (currentPlayer && typeof currentPlayer.getPosition === 'function') {
                const position = Number(currentPlayer.getPosition());
                if (Number.isFinite(position)) {
                    return position;
                }
            }
            return nativeVideo && Number.isFinite(Number(nativeVideo.currentTime)) ? Number(nativeVideo.currentTime) : 0;
        }

        function currentJwContainer() {
            if (currentPlayer && typeof currentPlayer.getContainer === 'function') {
                try {
                    const container = currentPlayer.getContainer();
                    if (container && container.nodeType === 1) {
                        return container;
                    }
                } catch (error) {}
            }
            if (holder && !holder.hidden && holder.classList && holder.classList.contains('jwplayer')) {
                return holder;
            }
            if (holder && !holder.hidden) {
                const candidate = holder.querySelector('.jwplayer');
                if (candidate) {
                    return candidate;
                }
            }
            return null;
        }

        function subtitleVideoElement(host) {
            if (!host) {
                return null;
            }
            if (host === nativeVideo) {
                return nativeVideo;
            }
            const videos = host.querySelectorAll ? host.querySelectorAll('video') : [];
            for (let index = 0; index < videos.length; index += 1) {
                const video = videos[index];
                if (video && video.videoWidth > 0 && video.videoHeight > 0) {
                    return video;
                }
            }
            return videos.length ? videos[0] : null;
        }

        function visibleMediaDimensions(host) {
            const target = host && host.nodeType === 1 ? host : playerFrame;
            let viewportWidth = Math.max(1, Number((window.visualViewport && window.visualViewport.width) || window.innerWidth || document.documentElement.clientWidth || 0));
            let viewportHeight = Math.max(1, Number((window.visualViewport && window.visualViewport.height) || window.innerHeight || document.documentElement.clientHeight || 0));

            /* In embeds, CSS transforms or a dynamically resized parent iframe can
             * make innerWidth larger than the actually displayed rectangle. Use the
             * outer iframe dimensions whenever same-origin access or a parent size
             * message is available. */
            if (embedMode && parentEmbedViewport) {
                viewportWidth = Math.min(viewportWidth, Math.max(1, Number(parentEmbedViewport.width || viewportWidth)));
                viewportHeight = Math.min(viewportHeight, Math.max(1, Number(parentEmbedViewport.height || viewportHeight)));
            }
            if (embedMode) {
                try {
                    if (window.frameElement && typeof window.frameElement.getBoundingClientRect === 'function') {
                        const frameRect = window.frameElement.getBoundingClientRect();
                        if (frameRect.width > 0) { viewportWidth = Math.min(viewportWidth, frameRect.width); }
                        if (frameRect.height > 0) { viewportHeight = Math.min(viewportHeight, frameRect.height); }
                    }
                } catch (error) {}
            }

            let width = target ? Number(target.clientWidth || 0) : viewportWidth;
            let height = target ? Number(target.clientHeight || 0) : viewportHeight;

            if (target && typeof target.getBoundingClientRect === 'function') {
                const rect = target.getBoundingClientRect();
                const visibleLeft = Math.max(0, Number(rect.left || 0));
                const visibleTop = Math.max(0, Number(rect.top || 0));
                const visibleRight = Math.min(viewportWidth, Number(rect.right || 0));
                const visibleBottom = Math.min(viewportHeight, Number(rect.bottom || 0));
                const visibleWidth = Math.max(0, visibleRight - visibleLeft);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                if (visibleWidth > 0) {
                    width = Math.min(width || visibleWidth, visibleWidth);
                }
                if (visibleHeight > 0) {
                    height = Math.min(height || visibleHeight, visibleHeight);
                }
            }

            return {
                width: Math.max(1, Math.min(width || viewportWidth, viewportWidth)),
                height: Math.max(1, Math.min(height || viewportHeight, viewportHeight))
            };
        }

        function renderedMediaGeometry(host, requestedWidth, requestedHeight) {
            const target = host && host.nodeType === 1 ? host : (currentJwContainer() || playerFrame);
            const dimensions = visibleMediaDimensions(target);
            const width = Math.max(1, Math.min(Number(requestedWidth || dimensions.width), dimensions.width));
            const height = Math.max(1, Math.min(Number(requestedHeight || dimensions.height), dimensions.height));
            let renderedWidth = width;
            let renderedHeight = height;
            const video = subtitleVideoElement(target);
            const videoWidth = video ? Number(video.videoWidth || 0) : 0;
            const videoHeight = video ? Number(video.videoHeight || 0) : 0;

            if (videoWidth > 0 && videoHeight > 0) {
                const fitScale = Math.min(width / videoWidth, height / videoHeight);
                renderedWidth = Math.max(1, videoWidth * fitScale);
                renderedHeight = Math.max(1, videoHeight * fitScale);
            } else {
                /* Until metadata is ready, assume the common 16:9 shape. This
                 * avoids restoring desktop-sized captions during the first
                 * frames of portrait fullscreen on mobile. */
                const assumedRatio = 16 / 9;
                if ((width / height) > assumedRatio) {
                    renderedWidth = Math.max(1, height * assumedRatio);
                } else {
                    renderedHeight = Math.max(1, width / assumedRatio);
                }
            }

            return {
                width: width,
                height: height,
                renderedWidth: renderedWidth,
                renderedHeight: renderedHeight,
                sideBar: Math.max(0, (width - renderedWidth) / 2),
                topBar: Math.max(0, (height - renderedHeight) / 2)
            };
        }

        function clampNumber(value, minimum, maximum, fallback) {
            const numeric = Number(value);
            return Math.max(minimum, Math.min(maximum, Number.isFinite(numeric) ? numeric : fallback));
        }

        function normalizeHexColor(value, fallback) {
            const color = String(value || '').trim();
            return /^#[0-9a-f]{6}$/i.test(color) ? color.toLowerCase() : fallback;
        }

        function loadSubtitleViewerPreferences() {
            let stored = {};
            try {
                stored = JSON.parse(window.localStorage.getItem(subtitlePreferenceStorageKey) || '{}') || {};
            } catch (error) {}
            return {
                sizePercent: clampNumber(stored.sizePercent, 50, 200, subtitleViewerDefaults.sizePercent),
                fontFamily: ['default', 'Tahoma', 'Arial', 'Trebuchet MS', 'sans-serif', 'serif'].includes(stored.fontFamily) ? stored.fontFamily : subtitleViewerDefaults.fontFamily,
                textColor: normalizeHexColor(stored.textColor, subtitleViewerDefaults.textColor),
                backgroundColor: normalizeHexColor(stored.backgroundColor, subtitleViewerDefaults.backgroundColor),
                backgroundOpacity: clampNumber(stored.backgroundOpacity, 0, 100, subtitleViewerDefaults.backgroundOpacity)
            };
        }

        function subtitleFamilyValue(preference) {
            if (!preference || preference === 'default') {
                return "'" + String(subtitleFontFamily || 'Tahoma').replace(/["']/g, '') + "', Tahoma, Arial, sans-serif";
            }
            if (preference === 'serif' || preference === 'sans-serif') {
                return preference;
            }
            return "'" + String(preference).replace(/["']/g, '') + "', Tahoma, Arial, sans-serif";
        }

        function hexToRgba(hex, opacity) {
            const safe = normalizeHexColor(hex, '#000000').slice(1);
            const red = parseInt(safe.slice(0, 2), 16);
            const green = parseInt(safe.slice(2, 4), 16);
            const blue = parseInt(safe.slice(4, 6), 16);
            return 'rgba(' + red + ',' + green + ',' + blue + ',' + (clampNumber(opacity, 0, 100, 0) / 100).toFixed(2) + ')';
        }

        function persistSubtitleViewerPreferences() {
            try {
                window.localStorage.setItem(subtitlePreferenceStorageKey, JSON.stringify(subtitleViewerPreferences));
            } catch (error) {}
        }

        function syncSubtitlePreferenceControls() {
            if (subtitleSizeControl) { subtitleSizeControl.value = String(subtitleViewerPreferences.sizePercent); }
            if (subtitleSizeValue) { subtitleSizeValue.textContent = Math.round(subtitleViewerPreferences.sizePercent) + '%'; }
            if (subtitleFontControl) { subtitleFontControl.value = subtitleViewerPreferences.fontFamily; }
            if (subtitleColorControl) { subtitleColorControl.value = subtitleViewerPreferences.textColor; }
            if (subtitleBackgroundControl) { subtitleBackgroundControl.value = subtitleViewerPreferences.backgroundColor; }
            if (subtitleOpacityControl) { subtitleOpacityControl.value = String(subtitleViewerPreferences.backgroundOpacity); }
            if (subtitleOpacityValue) { subtitleOpacityValue.textContent = Math.round(subtitleViewerPreferences.backgroundOpacity) + '%'; }
        }

        function applySubtitleViewerPreferences(persist) {
            const previewFontSize = clampNumber(28 * (subtitleViewerPreferences.sizePercent / 100), 16, 46, 28);
            document.documentElement.style.setProperty('--vnx-subtitle-family', subtitleFamilyValue(subtitleViewerPreferences.fontFamily));
            document.documentElement.style.setProperty('--vnx-subtitle-preview-size', previewFontSize.toFixed(2) + 'px');
            document.documentElement.style.setProperty('--vnx-subtitle-color', subtitleViewerPreferences.textColor);
            document.documentElement.style.setProperty('--vnx-subtitle-background', hexToRgba(subtitleViewerPreferences.backgroundColor, subtitleViewerPreferences.backgroundOpacity));
            syncSubtitlePreferenceControls();
            if (persist) { persistSubtitleViewerPreferences(); }
            refreshResponsiveMediaSizing(currentJwContainer() || subtitleHost || playerFrame || nativeVideo);
            scheduleSubtitleGeometry();
            renderedSubtitleSignature = '';
            renderCustomSubtitle();
        }


        function settleSubtitleStartupRendering() {
            if (!tracks.length) {
                document.body.classList.remove('vnx-subtitles-initializing', 'vnx-subtitle-font-loading', 'vnx-subtitle-layout-loading');
                return Promise.resolve();
            }

            /* A visitor-selected system font is available synchronously, so no
               reason to delay the Vnx overlay in that case. */
            const needsUploadedFont = subtitleViewerPreferences.fontFamily === 'default'
                && !!subtitleFontUrl
                && !!subtitleFontFamily;
            if (!needsUploadedFont || !document.fonts || typeof document.fonts.load !== 'function') {
                document.body.classList.remove('vnx-subtitle-font-loading');
                return Promise.resolve();
            }

            const escapedFamily = String(subtitleFontFamily).replace(/["']/g, '');
            let timeoutId = 0;
            const fontReady = document.fonts.load('400 32px "' + escapedFamily + '"').catch(function () { return []; });
            const timeout = new Promise(function (resolve) {
                timeoutId = window.setTimeout(resolve, 1800);
            });
            return Promise.race([fontReady, timeout]).then(function () {
                if (timeoutId) { window.clearTimeout(timeoutId); }
                document.body.classList.remove('vnx-subtitle-font-loading');
                renderedSubtitleSignature = '';
                refreshResponsiveMediaSizing(currentJwContainer() || subtitleHost || playerFrame || nativeVideo);
                scheduleSubtitleGeometry();
                renderCustomSubtitle();
            });
        }


        function markSubtitleLayoutReady() {
            if (!tracks.length) { return; }
            if (!document.body.classList.contains('vnx-subtitle-layout-loading')) { return; }
            document.body.classList.remove('vnx-subtitle-layout-loading');
            renderedSubtitleSignature = '';
            refreshResponsiveMediaSizing(currentJwContainer() || subtitleHost || playerFrame || nativeVideo);
            scheduleSubtitleGeometry();
            window.requestAnimationFrame(function () { renderCustomSubtitle(); });
        }

        function setSubtitleSettingsOpen(open) {
            const active = !!open;
            if (!subtitleSettings || !subtitleSettingsPanel || !subtitleSettingsButton) { return; }
            subtitleSettings.classList.toggle('is-open', active);
            subtitleSettingsPanel.hidden = !active;
            if (subtitleSettingsBackdrop) { subtitleSettingsBackdrop.hidden = !active; }
            subtitleSettingsButton.setAttribute('aria-expanded', active ? 'true' : 'false');
            document.body.classList.toggle('vnx-subtitle-sheet-open', active);
            if (active) {
                window.requestAnimationFrame(function () {
                    if (subtitleSettingsClose && window.matchMedia('(max-width: 600px), (pointer: coarse) and (max-height: 500px)').matches) {
                        subtitleSettingsClose.focus({ preventScroll: true });
                    }
                });
            } else if (document.activeElement && subtitleSettingsPanel.contains(document.activeElement)) {
                subtitleSettingsButton.focus({ preventScroll: true });
            }
        }

        function normalizedJwSettingsText(value) {
            return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
        }

        function isNativeCaptionVisualSettingsEntry(element) {
            if (!element || element.nodeType !== 1) { return false; }
            const combinedText = normalizedJwSettingsText([
                element.textContent,
                element.getAttribute('aria-label'),
                element.getAttribute('title')
            ].filter(Boolean).join(' '));
            const classText = normalizedJwSettingsText(element.className || '');
            if (classText.includes('jw-icon-cc') || classText.includes('captions')) {
                return true;
            }
            if (!combinedText) { return false; }
            return combinedText.includes('visual settings')
                || combinedText.includes('caption styling')
                || combinedText.includes('subtitle styling')
                || combinedText.includes('captions')
                || combinedText.includes('subtitles')
                || combinedText.includes('closed captions')
                || combinedText.includes('english')
                || combinedText.includes('الإنجليزية')
                || combinedText.includes('إيقاف الترجمة')
                || combinedText === 'off'
                || combinedText.includes('إعدادات الترجمة المرئية')
                || combinedText.includes('إعدادات مرئية للترجمة');
        }

        function hideNativeCaptionVisualSettings(root) {
            const scope = root && root.querySelectorAll ? root : document;
            const candidates = scope.querySelectorAll([
                '.jw-settings-menu button',
                '.jw-settings-menu [role="menuitem"]',
                '.jw-settings-content-item',
                '.jw-settings-menu a'
            ].join(','));
            candidates.forEach(function (element) {
                if (!isNativeCaptionVisualSettingsEntry(element)) { return; }
                element.classList.add('vnx-hide-native-caption-visual-settings');
                element.hidden = true;
                element.setAttribute('aria-hidden', 'true');
                element.setAttribute('tabindex', '-1');

        function initializeNativeCaptionVisualSettingsRemoval() {
            hideNativeCaptionVisualSettings(document);

            const observerRoot = holder || document.body;
            const observer = new MutationObserver(function (mutations) {
                let shouldScan = false;
                mutations.forEach(function (mutation) {
                    if (mutation.type === 'childList' || mutation.type === 'characterData' || mutation.type === 'attributes') {
                        shouldScan = true;
                    }
                });
                if (shouldScan) { hideNativeCaptionVisualSettings(observerRoot); }

            observer.observe(observerRoot, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ['aria-label', 'title']
            });

        function initializeSubtitleViewerControls() {

            if (subtitleSettingsReset) {

        function responsiveMediaScale(width, height) {
            /* The configured font size is defined at a 1280x720 reference video.
             * Every smaller rendered video uses the exact same linear ratio. A
             * 640x360 embed is 50%, 426x240 is about 33%, and 320x180 is 25%. */
            const safeWidth = Math.max(1, Number(width || 1));
            const safeHeight = Math.max(1, Number(height || 1));
            const widthScale = safeWidth / 1280;
            const heightScale = safeHeight / 720;
            return Math.max(0.04, Math.min(1, widthScale, heightScale));
        }

        function configuredSubtitleSizeForMedia(mediaWidth, mediaHeight) {
            const safeWidth = Math.max(1, Number(mediaWidth || 1));
            const safeHeight = Math.max(1, Number(mediaHeight || 1));
            /* نحول المساحة المرئية إلى عرض مكافئ 16:9 حتى يعتمد الحساب على
             * البعد الأصغر ولا يكبر الخط بسبب الحواف أو نسبة فيديو مختلفة. */
            const equivalentWidth = Math.max(1, Math.min(safeWidth, safeHeight * (16 / 9)));
            const points = Array.isArray(subtitleSizeProfile) ? subtitleSizeProfile
                .map(function (point) {
                    return {
                        width: Math.max(1, Number(point.width || 1)),
                        size: Math.max(6, Math.min(160, Number(point.size || 12)))
                    };
                })
                .sort(function (a, b) { return a.width - b.width; }) : [];

            if (!points.length) {
                return Math.max(6, Math.min(160, subtitleBaseFontSize || 48));
            }
            if (equivalentWidth <= points[0].width) {
                /* تحت 320×180 نستمر بالتصغير النسبي، مع حد قراءة 6px. */
                return Math.max(6, points[0].size * (equivalentWidth / points[0].width));
            }
            const last = points[points.length - 1];
            if (equivalentWidth >= last.width) {
                return last.size;
            }
            for (let index = 0; index < points.length - 1; index += 1) {
                const lower = points[index];
                const upper = points[index + 1];
                if (equivalentWidth >= lower.width && equivalentWidth <= upper.width) {
                    const ratio = (equivalentWidth - lower.width) / Math.max(1, upper.width - lower.width);
                    return lower.size + ((upper.size - lower.size) * ratio);
                }
            }
            return last.size;
        }

        function responsiveSubtitleFontSize(baseSize, mediaWidth, mediaHeight) {
            const viewerMultiplier = clampNumber(subtitleViewerPreferences.sizePercent, 50, 200, 100) / 100;
            const configuredSize = configuredSubtitleSizeForMedia(mediaWidth, mediaHeight);
            /* نحافظ على اختلاف أحجام Styles داخل ASS نسبةً إلى الحجم المرجعي. */
            const styleBase = Math.max(1, Number(baseSize || subtitleBaseFontSize || 48));
            const referenceBase = Math.max(1, Number(subtitleBaseFontSize || 48));
            const styleRatio = Math.max(0.25, Math.min(4, styleBase / referenceBase));
            return Math.max(6, Math.min(320, configuredSize * styleRatio * viewerMultiplier));
        }

        function responsiveSizingHost(preferredHost) {
            const activeFullscreen = fullscreenElement();
            if (activeFullscreen && activeFullscreen.nodeType === 1) {
                return activeFullscreen;
            }
            if (preferredHost && preferredHost.nodeType === 1) {
                return preferredHost;
            }
            return currentJwContainer() || subtitleHost || playerFrame || nativeVideo;
        }

        function refreshResponsiveMediaSizing(preferredHost) {
            const target = responsiveSizingHost(preferredHost);
            const dimensions = visibleMediaDimensions(target);
            return applyResponsiveMediaSizing(dimensions.width, dimensions.height, target);
        }

        function applyResponsiveMediaSizing(width, height, host) {
            const geometry = renderedMediaGeometry(host || currentJwContainer() || subtitleHost || playerFrame, width, height);
            const mediaWidth = geometry.renderedWidth;
            const mediaHeight = geometry.renderedHeight;
            const scale = responsiveMediaScale(mediaWidth, mediaHeight);
            let subtitleSize = responsiveSubtitleFontSize(subtitleBaseFontSize, mediaWidth, mediaHeight);

            const logoCap = Math.max(26, mediaWidth * 0.22);
            let logoWidth = Math.max(26, Math.min(logoBaseWidth, logoBaseWidth * scale, logoCap));

            subtitleSize = Math.round(subtitleSize * 10) / 10;
            logoWidth = Math.round(logoWidth);
            document.documentElement.style.setProperty('--vnx-subtitle-size', subtitleSize + 'px');
            document.documentElement.style.setProperty('--vnx-logo-width', logoWidth + 'px');

            /* Keep the logo inside the rendered video rectangle when fullscreen
             * adds letterbox/pillarbox bars around it. */
            const edgePadding = Math.max(8, Math.round(18 * scale));
            const controlsPadding = Math.max(36, Math.round(58 * scale));
            document.documentElement.style.setProperty('--vnx-logo-top', Math.round(geometry.topBar + edgePadding) + 'px');
            document.documentElement.style.setProperty('--vnx-logo-left', Math.round(geometry.sideBar + edgePadding) + 'px');
            document.documentElement.style.setProperty('--vnx-logo-right', Math.round(geometry.sideBar + edgePadding) + 'px');
            document.documentElement.style.setProperty('--vnx-logo-bottom', Math.round(geometry.topBar + controlsPadding) + 'px');

            if (logo) {
                logo.style.width = logoWidth + 'px';
            }
            return {
                scale: scale,
                geometry: geometry
            };
        }

            const renderedHeight = geometry.renderedHeight;

                height: height,

                renderedHeight: renderedHeight,

            let shiftY = '-100%';

                renderedWidth: hostWidth,
                renderedHeight: hostHeight,

        function keepSubtitleInsideRenderedVideo(element, placementGeometry) {

            const availableWidth = Math.max(40, bounds.right - bounds.left);
            const availableHeight = Math.max(24, bounds.bottom - bounds.top);

            const factorY = subtitleShiftFactor(placementGeometry.shiftY, -1);

            let top = Number(placementGeometry.top || 0) + (factorY * height);

                left = bounds.left;
            } else {
                left = Math.max(bounds.left, Math.min(bounds.right - width, left));
            }
            if (height >= availableHeight) {
                top = bounds.top;
            } else {
                top = Math.max(bounds.top, Math.min(bounds.bottom - height, top));

        function subtitleElementRect(element) {

            const height = Math.max(1, Number(element.offsetHeight || element.getBoundingClientRect().height || 1));

                top: top,
                right: left + width,
                bottom: top + height,

                height: height

        function subtitleRectsOverlap(first, second) {
            if (!first || !second) {

                && first.right > second.left
                && first.top < second.bottom
                && first.bottom > second.top;

        function preferredSubtitleStackDirection(cue, element) {
            const placement = cue && cue.placement ? cue.placement : null;
            const anchor = placement ? String(placement.lineAnchor || 'auto').toLowerCase() : 'end';
            if (anchor === 'start') {

            if (anchor === 'end') {
                return -1; // Bottom-aligned cues grow upward.

            const rect = subtitleElementRect(element);
            const bounds = subtitleSafeBounds();
            const center = rect ? rect.top + (rect.height / 2) : (bounds.top + bounds.bottom) / 2;

        function resolveSubtitleCueOverlaps(entries) {

            const bounds = subtitleSafeBounds();
            const computedSize = parseFloat(window.getComputedStyle(document.documentElement).getPropertyValue('--vnx-subtitle-size')) || subtitleBaseFontSize || 24;
            const gap = Math.max(3, Math.min(14, computedSize * 0.18));
            const placed = [];

            entries.forEach(function (entry) {
                const element = entry && entry.element ? entry.element : null;
                if (!element) {

                let attempts = 0;
                const maxAttempts = Math.max(6, placed.length * 4);

                while (attempts < maxAttempts) {
                    attempts += 1;
                    const current = subtitleElementRect(element);
                    const collisions = placed.filter(function (previous) {
                        return subtitleRectsOverlap(current, subtitleElementRect(previous.element));
                    });
                    if (!collisions.length || !current) {
                        break;

                    const collisionRects = collisions.map(function (previous) {
                        return subtitleElementRect(previous.element);
                    }).filter(Boolean);
                    if (!collisionRects.length) {

                    }

                    const highestTop = Math.min.apply(null, collisionRects.map(function (rect) { return rect.top; }));
                    const lowestBottom = Math.max.apply(null, collisionRects.map(function (rect) { return rect.bottom; }));
                    const upwardTop = highestTop - current.height - gap;
                    const downwardTop = lowestBottom + gap;
                    const upwardFits = upwardTop >= bounds.top;
                    const downwardFits = downwardTop + current.height <= bounds.bottom;

                    if (direction < 0 && upwardFits) {
                        nextTop = upwardTop;
                    } else if (direction > 0 && downwardFits) {
                        nextTop = downwardTop;
                    } else if (upwardFits) {
                        nextTop = upwardTop;
                        direction = -1;
                    } else if (downwardFits) {
                        nextTop = downwardTop;
                        direction = 1;
                    } else {
                        const roomAbove = Math.max(0, current.top - bounds.top);
                        const roomBelow = Math.max(0, bounds.bottom - current.bottom);
                        direction = roomAbove >= roomBelow ? -1 : 1;
                        nextTop = direction < 0
                            ? Math.max(bounds.top, upwardTop)
                            : Math.min(bounds.bottom - current.height, downwardTop);

                    const oldTop = parseFloat(element.style.top) || current.top;
                    const safeTop = Math.max(bounds.top, Math.min(bounds.bottom - current.height, nextTop));
                    if (Math.abs(safeTop - oldTop) < 0.5) {

                    }

        function clearSubtitleOverlay() {

                element.style.top = Math.round(geometry.top * 10) / 10 + 'px';

        function renderCustomSubtitle(position) {

                || !customSubtitleEnabled

                || isVideoElement(fullscreenElement())

                clearSubtitleOverlay();

        function setCustomSubtitleEnabled(enabled) {

        function removeManagedSubtitleFallbackTracks() {

            roots.forEach(function (root) {

                    return;
                }
                root.querySelectorAll('track[data-vnx-subtitle-fallback="1"]').forEach(function (trackNode) {

            });
        }

        function suppressJwCaptionRenderer(player) {
            if (!player || builtInSubtitleFallbackActive) {
                return;

            if (typeof player.setCurrentCaptions === 'function' && !jwCaptionSuppressionPending) {
                let currentIndex = null;
                if (typeof player.getCurrentCaptions === 'function') {
                    try {
                        currentIndex = Number(player.getCurrentCaptions());
                    } catch (error) {}

            if (!container || typeof container.querySelectorAll !== 'function') {
                return;
            }
            container.querySelectorAll('video').forEach(function (video) {
                if (!video.textTracks) {
                    return;
                }
                const bridgeNode = video.querySelector('track[data-vnx-native-fullscreen-track="1"]');

                        activeNativeSubtitleTrack.mode = 'showing';
                    } catch (error) {}

                }

                const video = container && typeof container.querySelector === 'function'
                    ? container.querySelector('video')
                    : null;
                if (!video) {
                    return;
                }
                video.querySelectorAll('track[data-vnx-subtitle-fallback="1"]').forEach(function (node) {

                });
                if (video.textTracks) {
                    for (let index = 0; index < video.textTracks.length; index += 1) {

                        } catch (error) {}
                    }

                trackNode.default = true;

        function subtitleCandidateUrls(trackData) {

                try {

                    if (seen.has(absolute)) {
                        return false;
                    }
                    seen.add(absolute);
                    return true;
                } catch (error) {
                    return false;
                }
            });
        }

        async function fetchSubtitleCandidate(url, bypassCache) {

            }

        async function fetchSubtitleText(trackData) {

            for (let round = 0; round < 2; round += 1) {
                for (let index = 0; index < urls.length; index += 1) {
                    try {
                        return await fetchSubtitleCandidate(urls[index], round > 0);
                    } catch (error) {

                        window.setTimeout(resolve, 900);
                    });
                }

            throw lastError || new Error('Subtitle request failed');

            if (!Number.isFinite(total) || total <= 0) { return; }
            const delays = [1800, 4500, 8000];
            const delay = delays[Math.min(skipFallbackAttempts - 1, delays.length - 1)] || 3000;
            skipFallbackRetryTimer = window.setTimeout(function () {
                skipFallbackRetryTimer = 0;
                fetchAniSkipClient(total, true);
            }, delay);
        }

        async function fetchAniSkipClient(duration, forceRetry) {
            if (hasSkipSegment('intro')) { return null; }
            if (skipFallbackPromise) { return skipFallbackPromise; }
            if (!forceRetry && skipFallbackRequested) { return null; }
            if (skipFallbackAttempts >= 3) { return null; }

            const malId = skipLookup && /^\d+$/.test(String(skipLookup.mal_id || '')) ? String(skipLookup.mal_id) : '';
            const episodeNumber = skipLookup && /^\d+(?:\.\d+)?$/.test(String(skipLookup.episode || '')) ? String(skipLookup.episode) : '';
            if (!malId || !episodeNumber) { return null; }
            if (hasSkipSegment('intro') && hasSkipSegment('outro') && hasSkipSegment('recap')) { return null; }

            const knownDuration = Number(duration);
            if (!Number.isFinite(knownDuration) || knownDuration <= 0) { return null; }
            skipFallbackRequested = true;
            skipFallbackAttempts += 1;
            skipFallbackPromise = (async function () {
                const incoming = { intro: null, outro: null, recap: null };

                const requestAniSkip = async function (episodeLength) {
                    const query = new URLSearchParams();
                    ['op', 'ed', 'mixed-op', 'mixed-ed', 'recap'].forEach(function (type) {
                        query.append('types[]', type);
                    });
                    query.set('episodeLength', String(episodeLength));
                    const url = 'https://api.aniskip.com/v2/skip-times/' + encodeURIComponent(malId) + '/' + encodeURIComponent(episodeNumber) + '?' + query.toString();
                    try {
                        const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store' });
                        if (!response.ok) { return; }
                        const payload = await response.json();
                        if (!payload || !Array.isArray(payload.results)) { return; }
                        payload.results.forEach(function (item) {
                            if (!item || typeof item !== 'object' || !item.interval) { return; }
                            const type = String(item.skipType || item.skip_type || '').toLowerCase();
                            let key = '';
                            if (type === 'op' || type === 'mixed-op') { key = 'intro'; }
                            else if (type === 'ed' || type === 'mixed-ed') { key = 'outro'; }
                            else if (type === 'recap') { key = 'recap'; }
                            if (!key || incoming[key] || hasSkipSegment(key)) { return; }
                            const start = Number(item.interval.startTime ?? item.interval.start_time);
                            const end = Number(item.interval.endTime ?? item.interval.end_time);
                            if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end <= start) { return; }
                            incoming[key] = {
                                start: start,
                                end: end,
                                source: 'aniskip',
                                reference_duration: Number(item.episodeLength || item.episode_length || episodeLength || knownDuration) || knownDuration
                            };
                        });
                    } catch (error) {}
                };

                await requestAniSkip(Math.round(knownDuration * 1000) / 1000);
                if ((!incoming.intro && !hasSkipSegment('intro')) || (!incoming.outro && !hasSkipSegment('outro')) || (!incoming.recap && !hasSkipSegment('recap'))) {
                    await requestAniSkip(0);
                }

                if (mergeClientSkipSegments(incoming)) {
                    refreshSkipUiAfterMetadata();
                }
                if (!hasSkipSegment('intro')) {
                    scheduleAniSkipRetry(knownDuration);
                } else if (skipFallbackRetryTimer) {
                    window.clearTimeout(skipFallbackRetryTimer);
                    skipFallbackRetryTimer = 0;
                }
                return incoming;
            })().finally(function () {
                skipFallbackPromise = null;
                /* Requested means this attempt has run, not that future retries
                   are forbidden. The attempt cap prevents request loops. */
                skipFallbackRequested = false;
            });
            return skipFallbackPromise;
        }

        function maybeLoadSkipFallback(duration) {
            if (hasSkipSegment('intro') && hasSkipSegment('outro') && hasSkipSegment('recap')) { return; }
            const total = Number(duration);
            if (!Number.isFinite(total) || total <= 0) { return; }
            if (skipFallbackPromise || skipFallbackGatePromise || skipFallbackAttempts >= 3) { return; }

            /* Start the exact provider/Anikoto lookup immediately, but never
               hold playback for it. Give it a short head start so exact data
               normally wins; after 2.5s AniSkip may fill any remaining gaps.
               If Anikoto arrives later its higher source rank upgrades AniSkip. */
            const background = fetchSkipMetadataBackground();
            const shortWait = new Promise(function (resolve) {
                window.setTimeout(resolve, 2500);
            });
            skipFallbackGatePromise = Promise.race([
                Promise.resolve(background).catch(function () { return null; }),
                shortWait
            ]).then(function () {
                if (hasSkipSegment('intro') && hasSkipSegment('outro') && hasSkipSegment('recap')) { return null; }
                return fetchAniSkipClient(total);
            }).finally(function () {
                skipFallbackGatePromise = null;
            });
        }

        function scheduleSkipSeekRecheck(player, hintedPosition) {
            skipSeekRefreshTimers.forEach(function (timer) { window.clearTimeout(timer); });
            skipSeekRefreshTimers = [];
            [0, 70, 180, 420, 850, 1500, 2600].forEach(function (delay) {
                skipSeekRefreshTimers.push(window.setTimeout(function () {
                    const position = player && typeof player.getPosition === 'function'
                        ? Number(player.getPosition())
                        : (nativeVideo ? Number(nativeVideo.currentTime) : Number(hintedPosition));
                    const duration = player && typeof player.getDuration === 'function'
                        ? Number(player.getDuration())
                        : (nativeVideo ? Number(nativeVideo.duration) : 0);
                    updateSkipSegmentControl(Number.isFinite(position) ? position : Number(hintedPosition), duration);
                    if (!hasSkipSegment('intro')) {
                        if (!skipMetadataPromise && !skipMetadataRetryTimer && skipMetadataAttempts < 8) {
                            fetchSkipMetadataBackground(true);
                        }
                        if (Number.isFinite(duration) && duration > 0 && !skipFallbackPromise && skipFallbackAttempts < 3) {
                            /* When the viewer manually jumps near the intro, do
                               not wait for the normal 2.5s AniSkip gate. Start
                               that independent fallback immediately in parallel. */
                            fetchAniSkipClient(duration, true);
                        }
                    }
                }, delay));
            });
        }

        function ensureSkipPositionPoll(player) {
            if (skipPositionPollTimer) { return; }
            skipPositionPollTimer = window.setInterval(function () {
                const activePlayer = player || currentPlayer;
                const position = activePlayer && typeof activePlayer.getPosition === 'function'
                    ? Number(activePlayer.getPosition())
                    : (nativeVideo ? Number(nativeVideo.currentTime) : NaN);
                const duration = activePlayer && typeof activePlayer.getDuration === 'function'
                    ? Number(activePlayer.getDuration())
                    : (nativeVideo ? Number(nativeVideo.duration) : 0);
                if (Number.isFinite(position) && position >= 0) {
                    updateSkipSegmentControl(position, duration);
                }
                if (!hasSkipSegment('intro') && !skipMetadataPromise && !skipMetadataRetryTimer && skipMetadataAttempts < 8) {
                    fetchSkipMetadataBackground();
                }
                /* Once the intro is skipped or its end has been reached, normal
                   time/seek events are enough; stop the 250ms reliability poll. */
                const intro = normalizedSkipSegment('intro', duration);
                if (introSkipDismissed || (intro && Number.isFinite(position) && position >= intro.end - 0.08)) {
                    window.clearInterval(skipPositionPollTimer);
                    skipPositionPollTimer = 0;
                }
            }, 250);
        }

        function normalizedSkipSegment(key, duration) {
            if (!skipSegments || typeof skipSegments !== 'object') { return null; }
            const raw = skipSegments[key];
            if (!raw || typeof raw !== 'object') { return null; }
            let start = Number(raw.start);
            let end = Number(raw.end);
            if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end <= start) {
                return null;
            }

            /* AniSkip and S1's verified Anikoto reference may describe another
               encode. If our HLS duration differs slightly, shift both bounds
               by that difference. Exact provider-native timing is never moved. */
            const total = Number(duration);
            const referenceDuration = Number(raw.reference_duration || raw.referenceDuration || 0);
            const source = String(raw.source || 'provider').toLowerCase();
            if ((source === 'aniskip' || source === 'anikoto_reference')
                && Number.isFinite(total) && total > 0
                && Number.isFinite(referenceDuration) && referenceDuration > 0) {
                const delta = total - referenceDuration;
                if (Math.abs(delta) <= 120) {
                    start = Math.max(0, start + delta);
                    end = Math.max(start + 0.1, end + delta);
                }
            }
            return { key: key, start: start, end: end, source: source };
        }

        function skipSegmentForPosition(position, duration) {
            const now = Number(position);
            const total = Number(duration);
            if (!Number.isFinite(now)) { return null; }
            for (const key of ['recap', 'intro', 'outro']) {
                if (key === 'intro' && introSkipDismissed) { continue; }
                const segment = normalizedSkipSegment(key, total);
                if (!segment) { continue; }
                /* Reject metadata that extends materially beyond this exact
                   encode. This keeps provider timing accurate if a bad/stale
                   metadata record is ever returned. */
                if (Number.isFinite(total) && total > 0 && segment.end > total + 3) {
                    continue;
                }
                if (now >= segment.start && now < segment.end - 0.08) {
                    return segment;
                }
            }
            return null;
        }

        function ensureSkipSegmentButton() {
            const host = currentJwContainer() || playerFrame;
            if (!host) { return null; }
            if (!skipSegmentButton) {
                skipSegmentButton = document.createElement('button');
                skipSegmentButton.type = 'button';
                skipSegmentButton.className = 'vnx-skip-segment-button';
                skipSegmentButton.hidden = true;
                skipSegmentButton.setAttribute('aria-live', 'polite');
                skipSegmentButton.addEventListener('click', function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    const segment = normalizedSkipSegment(activeSkipSegmentKey, currentPlayer && typeof currentPlayer.getDuration === 'function' ? currentPlayer.getDuration() : (nativeVideo ? nativeVideo.duration : 0));
                    if (!segment) { return; }
                    const target = segment.end;
                    if (activeSkipSegmentKey === 'intro') {
                        introSkipDismissed = true;
                        introSkipLatched = false;
                    }
                    if (currentPlayer && typeof currentPlayer.seek === 'function') {
                        currentPlayer.seek(target);
                    } else if (nativeVideo) {
                        nativeVideo.currentTime = Math.min(Number.isFinite(Number(nativeVideo.duration)) ? Number(nativeVideo.duration) : target, target);
                    }
                    renderCustomSubtitle(target);
                    updateSkipSegmentControl(target);
                }, false);
            }
            if (skipSegmentButton.parentNode !== host) {
                host.appendChild(skipSegmentButton);
            }
            return skipSegmentButton;
        }

        function updateSkipSegmentControl(position, duration) {
            const button = ensureSkipSegmentButton();
            if (!button) { return; }
            const actualDuration = Number.isFinite(Number(duration))
                ? Number(duration)
                : (currentPlayer && typeof currentPlayer.getDuration === 'function'
                    ? Number(currentPlayer.getDuration())
                    : (nativeVideo ? Number(nativeVideo.duration) : 0));
            const now = Number(position);

            /* The intro control is visible only inside its real time window.
               Re-evaluating this on time, seek and metadata events preserves
               the 3.22.7 race fix while preventing a stale button after end. */
            const intro = normalizedSkipSegment('intro', actualDuration);
            introSkipLatched = false;
            if (!introSkipDismissed && intro && Number.isFinite(now)) {
                const introFitsVideo = !(Number.isFinite(actualDuration) && actualDuration > 0 && intro.end > actualDuration + 3);
                introSkipLatched = introFitsVideo
                    && now >= intro.start - 0.08
                    && now < intro.end - 0.08;
            }

            if (introSkipLatched && !introSkipDismissed && intro) {
                activeSkipSegmentKey = 'intro';
                const label = 'تخطي المقدمة';
                button.textContent = label;
                button.setAttribute('aria-label', label);
                button.setAttribute('title', label);
                button.hidden = false;
                return;
            }

            const segment = skipSegmentForPosition(now, actualDuration);
            if (!segment) {
                activeSkipSegmentKey = '';
                button.hidden = true;
                return;
            }
            activeSkipSegmentKey = segment.key;
            const label = segment.key === 'intro' ? 'تخطي المقدمة' : (segment.key === 'outro' ? 'تخطي النهاية' : 'تخطي الملخص');
            button.textContent = label;
            button.setAttribute('aria-label', label);
            button.setAttribute('title', label);
            button.hidden = false;
        }

        function installSkipCuePoints(player) {
            if (skipCuePointsInstalled || !player || typeof player.addCues !== 'function') { return; }
            const cues = [];
            const duration = typeof player.getDuration === 'function' ? Number(player.getDuration()) : 0;
            const recap = normalizedSkipSegment('recap', duration);
            const intro = normalizedSkipSegment('intro', duration);
            const outro = normalizedSkipSegment('outro', duration);
            if (recap) { cues.push({ begin: recap.start, text: 'بداية الملخص', cueType: 'vnx-recap' }); }
            if (intro) { cues.push({ begin: intro.start, text: 'بداية المقدمة', cueType: 'vnx-intro' }); }
            if (outro) { cues.push({ begin: outro.start, text: 'بداية النهاية', cueType: 'vnx-outro' }); }
            if (!cues.length) { return; }
            try {
                player.addCues(cues);
                skipCuePointsInstalled = true;
            } catch (error) {}
        }

        function installJwUtilityControls(player) {
            if (!player) { return; }
            jwUtilityControlsInstalled = true;
            scheduleForward10Mount(player);
            installSkipCuePoints(player);
            ensureSkipPositionPoll(player);
            updateSkipSegmentControl(typeof player.getPosition === 'function' ? player.getPosition() : 0,
                typeof player.getDuration === 'function' ? player.getDuration() : 0);
            fetchSkipMetadataBackground();
        }

        async function bootPlayer(forceRetry) {
            if (!playerAvailable) {
                return;
            }
            /* A JW retry may rebuild the controls. Preserve only the explicit
               click/dismiss state; visibility is recalculated from position. */
            activeSkipSegmentKey = '';
            skipCuePointsInstalled = false;
            if (forceRetry) {
                skipFallbackRequested = false;
                skipFallbackPromise = null;
                skipFallbackGatePromise = null;
                skipFallbackAttempts = 0;
                if (skipFallbackRetryTimer) { window.clearTimeout(skipFallbackRetryTimer); skipFallbackRetryTimer = 0; }
                skipMetadataRequested = false;
                skipMetadataPromise = null;
                skipMetadataAttempts = 0;
                skipMetadataPending = false;
                skipMetadataIntroResolved = hasSkipSegment('intro');
                if (skipMetadataRetryTimer) { window.clearTimeout(skipMetadataRetryTimer); skipMetadataRetryTimer = 0; }
            }
            introSkipLatched = false;
            if (skipSegmentButton) {
                skipSegmentButton.hidden = true;
                skipSegmentButton.textContent = '';
            }
            if (playerBooted && !forceRetry) {
                if (autoplayRequested) {
                    if (currentPlayer && typeof currentPlayer.play === 'function') {
                        currentPlayer.play(true);
                    } else if (nativeVideo) {
                        nativeVideo.play().catch(function () {});
                    }
                }
                return;
            }
            playerBooted = true;

            /* Start preparing captions immediately, independently of JW's own
               caption events. This keeps subtitles working even if the player
               library does not emit captionsList/captionsChanged. */
            if (tracks.length) {
                loadCustomSubtitleTrack(preferredSubtitleTrackIndex());
            }

            try {
                streamUrl = await resolvePlayableStream();
            } catch (error) {
                renderPlaybackError(error && error.message ? error.message : 'تعذر الوصول إلى ملف HLS من الـCDN.');
                return;
            }

            if (window.jwplayer) {
                try {
                    const player = window.jwplayer('megaplay-player');
                    currentPlayer = player;
                    /* External subtitles are fetched and rendered only by the
                     * Vnx overlay. Passing the same file to JW created a second
                     * native/JW caption layer on some TVs and WebViews. */
                    const setupConfig = {
                        file: streamUrl,
                        type: 'hls',
                        width: '100%',
                        height: '100%',
                        autostart: autoplayRequested,
                        mute: false,
                        preload: 'auto',
                        hlshtml: true,
                        primary: 'html5',
                        stretching: 'uniform',
                        /* Expose playback speed in JW's settings menu. The
                           values deliberately keep 1x as the default and add
                           practical acceleration steps up to 2x. */
                        playbackRateControls: true,
                        playbackRates: [1, 1.25, 1.5, 1.75, 2],
                        captions: {
                            fontFamily: subtitleViewerPreferences.fontFamily === 'default' ? subtitleFontFamily : subtitleViewerPreferences.fontFamily,
                            fontSize: responsiveSubtitleFontSize(subtitleStyle.fontSize, visibleMediaDimensions(currentJwContainer() || playerFrame).width, visibleMediaDimensions(currentJwContainer() || playerFrame).height),
                            color: subtitleViewerPreferences.textColor,
                            backgroundColor: subtitleViewerPreferences.backgroundColor,
                            backgroundOpacity: subtitleViewerPreferences.backgroundOpacity,
                            edgeStyle: 'dropshadow'
                        },
                        skin: { name: 'netflix' }
                    };

                    player.on('captionsList', function (event) {
                        selectUploadedCaptionInJw(player, event && event.tracks ? event.tracks : []);
                    });
                    player.on('captionsChanged', function () {
                        /* Never let an embedded/native JW caption run beside
                         * the external Arabic Vnx overlay. */
                        if (tracks.length && !builtInSubtitleFallbackActive) {
                            loadCustomSubtitleTrack(preferredSubtitleTrackIndex());
                            window.setTimeout(function () {
                                suppressJwCaptionRenderer(player);
                            }, 0);
                        }
                    });
                    player.on('time', function (event) {
                        const position = event && Number.isFinite(Number(event.position)) ? Number(event.position) : undefined;
                        renderCustomSubtitle(position);
                        const eventDuration = event && Number.isFinite(Number(event.duration)) ? Number(event.duration) : 0;
                        updateSkipSegmentControl(position, eventDuration);
                        maybeLoadSkipFallback(eventDuration);
                        if (!resumeApplied && Number.isFinite(Number(event && event.duration)) && Number(event.duration) > 0) {
                            applyResumeToJw(player);
                        }
                        savePlaybackProgress(position, event && Number.isFinite(Number(event.duration)) ? Number(event.duration) : (typeof player.getDuration === 'function' ? player.getDuration() : 0), false);
                    });
                    player.on('seek', function (event) {
                        const offset = event && Number.isFinite(Number(event.offset)) ? Number(event.offset) : undefined;
                        const duration = typeof player.getDuration === 'function' ? Number(player.getDuration()) : 0;
                        renderCustomSubtitle(offset);
                        updateSkipSegmentControl(offset, duration);
                        scheduleSkipSeekRecheck(player, offset);
                    });
                    player.on('setupError', function (event) {
                        handlePlaybackFailure(new Error(event && event.message ? event.message : 'فشل إعداد المشغل.'));
                    });
                    player.on('error', function (event) {
                        handlePlaybackFailure(new Error(event && event.message ? event.message : 'فشل تشغيل ملف HLS.'));
                    });
                    player.setup(setupConfig);
                    window.setTimeout(function () {
                        mountSubtitleOverlay(currentJwContainer() || holder || playerFrame);
                        discoverJwNativeFullscreenVideos();
                    }, 0);
                    player.on('ready', function () {
                        installJwUtilityControls(player);
                        ensureSkipSegmentButton();
                        mountSubtitleOverlay(currentJwContainer() || holder || playerFrame);
                        window.setTimeout(function () {
                            const state = typeof player.getState === 'function' ? String(player.getState() || '') : '';
                            const position = typeof player.getPosition === 'function' ? Number(player.getPosition()) : 0;
                            if (state === 'playing' || state === 'buffering' || position > 0) {
                                markSubtitleLayoutReady();
                            }
                        }, 1800);
                        discoverJwNativeFullscreenVideos();
                        applyResumeToJw(player);
                        loadCustomSubtitleTrack(preferredSubtitleTrackIndex());
                        if (tracks.length) {
                            suppressJwCaptionRenderer(player);
                        }
                        scheduleSubtitleGeometry();
                        [0, 500, 1600].forEach(function (delay) {
                            window.setTimeout(function () {
                                mountSubtitleOverlay(currentJwContainer() || holder || playerFrame);
                                discoverJwNativeFullscreenVideos();
                                if (typeof player.getCaptionsList === 'function') {
                                    selectUploadedCaptionInJw(player, player.getCaptionsList());
                                }
                                if (tracks.length && !builtInSubtitleFallbackActive) {
                                    suppressJwCaptionRenderer(player);
                                }
                                scheduleSubtitleGeometry();
                            }, delay);
                        });
                    });
                    player.on('firstFrame', function () {
                        scheduleForward10Mount(player);
                        ensureSkipSegmentButton();
                        installSkipCuePoints(player);
                        const firstFrameDuration = typeof player.getDuration === 'function' ? Number(player.getDuration()) : 0;
                        updateSkipSegmentControl(typeof player.getPosition === 'function' ? player.getPosition() : 0, firstFrameDuration);
                        maybeLoadSkipFallback(firstFrameDuration);
                        mountSubtitleOverlay(currentJwContainer() || holder || playerFrame);
                        markSubtitleLayoutReady();
                        discoverJwNativeFullscreenVideos();
                        applyResumeToJw(player);
                        renderCustomSubtitle();
                        if (tracks.length && !builtInSubtitleFallbackActive) {
                            suppressJwCaptionRenderer(player);
                        }

                    });

                        refreshResponsiveLayout();
                        scheduleForward10Mount(player);
                        ensureSkipSegmentButton();
                    });
                    player.on('play', function () {
                        recordPlaybackView();
                        mountSubtitleOverlay(currentJwContainer() || holder || playerFrame);
                        discoverJwNativeFullscreenVideos();
                        renderCustomSubtitle();
                    });
                    player.on('pause', function () {
                        savePlaybackProgress(typeof player.getPosition === 'function' ? player.getPosition() : 0, typeof player.getDuration === 'function' ? player.getDuration() : 0, true);
                    });

                    player.on('fullscreen', function (event) {
                        window.setTimeout(function () {
                            discoverJwNativeFullscreenVideos();
                            updateFullscreenState(!!(event && event.fullscreen));
                            scheduleForward10Mount(player);
                            ensureSkipSegmentButton();
                        }, 0);
                    });
                    return;
                } catch (error) {
                    useNativePlayer();
                    return;
                }
            }
            useNativePlayer();
        }

        function pausePlayer() {
            if (currentPlayer && typeof currentPlayer.pause === 'function') {
                currentPlayer.pause(true);
            }
            if (nativeVideo && !nativeVideo.paused) {
                nativeVideo.pause();
            }

        function updateMode(mode) {

            watchModeButton.classList.toggle('is-active', watching);
            downloadModeButton.classList.toggle('is-active', !watching);
            watchModeButton.setAttribute('aria-selected', watching ? 'true' : 'false');
            downloadModeButton.setAttribute('aria-selected', watching ? 'false' : 'true');
            chooserTitle.textContent = watching ? 'اختر سيرفر المشاهدة' : 'اختر سيرفر التحميل';
            chooserText.textContent = watching
                ? 'اختر أحد السيرفرين لبدء المشاهدة داخل نفس الواجهة.'
                : 'اختر أحد السيرفرين لفتح صفحة التحميل الخاصة به.';
        }

        function showChooser() {
            autoplayRequested = false;
            entryScreen.hidden = true;
            shell.hidden = false;
            chooser.hidden = false;
            playerPanel.hidden = true;
            backButton.hidden = true;

            }
        }

        function showDirectEntry() {
            autoplayRequested = false;
            document.body.classList.remove('vnx-direct-playing');
            entryScreen.hidden = false;
            shell.hidden = true;
            chooser.hidden = true;
            playerPanel.hidden = true;
            backButton.hidden = true;

        function showPlayer() {
            setSubtitleSettingsOpen(false);
            if (embedMode) {
                document.body.classList.add('vnx-direct-playing');
            }
            entryScreen.hidden = true;
            shell.hidden = false;
            chooser.hidden = true;
            playerPanel.hidden = false;
            backButton.hidden = embedMode;
            /* Start exact skip-data resolution before JW finishes booting. This
               mirrors Anikoto's timing flow more closely: metadata is already

        entryButton.addEventListener('click', function () {

        watchModeButton.addEventListener('click', function () {
            updateMode('watch');
        });
        if (downloadModeButton && downloadEnabled) {
            downloadModeButton.addEventListener('click', function () {
                updateMode('download');
            });
        }

        if (serverGrid) { serverGrid.addEventListener('click', function (event) {
            const button = event.target.closest('.vnx-server-card');
            if (!button) {
                return;
            }
            const watchUrl = button.getAttribute('data-watch-url') || '';
            const downloadUrl = button.getAttribute('data-download-url') || '';
            const key = button.getAttribute('data-key') || '';

            if (currentMode === 'download') {
                if (downloadUrl) {
                    window.location.href = downloadUrl;

            if (key === currentServerKey) {
                autoplayRequested = autoplayAfterServerSelect;
